name: Deploy rullst.win

# The landing and privacy pages (English at /, Brazilian Portuguese at /pt-br/)
# are maintained in Rullst/Rullst under docs/. This workflow assembles them from
# that repository's public main branch and deploys them; this repository keeps
# no copy. /Rullst/ (book, benchmark dashboards) and /Benchmarks/ are deployed
# by their own repositories.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # The compact summary Rullst/Benchmarks publishes with every set of results
  # (schema rullst.benchmarks.site.v2); the comparison page renders its scores,
  # positions, flags, memory and Rullst reading at build time (the page itself
  # makes no request). results/latest.json is no longer read: it outgrew the
  # 1 MiB limit with the v3 results. Missing, invalid or unknown data keeps the
  # "no current results" text instead of older numbers.
  # The committed copy is read from GitHub: Cloudflare in front of rullst.win
  # answers runner requests with 403, so rullst.win/Benchmarks/data/site.json
  # (the same file) cannot be fetched from Actions.
  BENCHMARKS_URL: https://raw.githubusercontent.com/Rullst/Benchmarks/main/results/site.json
  # Results measured longer ago than this many days are not shown.
  BENCHMARKS_MAX_AGE_DAYS: "90"

jobs:
  build:
    name: Assemble the site from Rullst/Rullst main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the framework source (public, read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Rullst/Rullst
          ref: main
          path: rullst
          persist-credentials: false
          sparse-checkout-cone-mode: false
          # Every page template (docs/*.html), the shared assets and the
          # assembler; new pages need no change here.
          sparse-checkout: |
            /.github/assemble-organization-site.py
            /docs/*.html
            /docs/site.css
            /docs/site.js
            /docs/flags/

      - name: Download the latest benchmark summary
        run: |
          if curl --fail --silent --show-error --location --proto '=https' --max-time 30 \
            --max-filesize 1048576 --output benchmarks.json "$BENCHMARKS_URL"; then
            echo "Benchmark results: $BENCHMARKS_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            rm -f benchmarks.json
            echo "::warning title=Benchmark results not downloaded::$BENCHMARKS_URL could not be fetched; the comparison page keeps the in-progress text."
            echo "Benchmark results not available; the comparison page shows that the measurement is in progress." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Assemble the pages and assets
        run: |
          args=(--out public_site)
          help="$(python3 rullst/.github/assemble-organization-site.py --help)"
          if [ -s benchmarks.json ] && grep -q -- --benchmarks <<< "$help"; then
            args+=(--benchmarks)  # reads ./benchmarks.json
            if grep -q -- --benchmarks-max-age-days <<< "$help"; then
              args+=(--benchmarks-max-age-days "$BENCHMARKS_MAX_AGE_DAYS")
            fi
          fi
          python3 rullst/.github/assemble-organization-site.py "${args[@]}" 2> assemble.log || { cat assemble.log; exit 1; }
          if [ -s assemble.log ]; then
            cat assemble.log
            { echo; echo '```'; cat assemble.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Record the source commit
        run: |
          {
            echo "Assembled from Rullst/Rullst@$(git -C rullst rev-parse HEAD):"
            echo
            (cd public_site && find . -type f | sort | sed 's/^/- /')
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./public_site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
